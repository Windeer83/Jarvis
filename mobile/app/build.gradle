plugins {
    id "com.android.application"
}

android {
    namespace = "com.jarvis.mobile"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.jarvis.mobile"
        minSdk = 29
        targetSdk = 36
        versionCode = (project.findProperty("jarvisVersionCode") ?: "1").toInteger()
        versionName = project.findProperty("jarvisVersionName") ?: "0.2.0-alpha"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug { debuggable = true }
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    testImplementation "junit:junit:4.13.2"
}

tasks.register("verifyScannerRuntimeClasspath") {
    doLast {
        def hasAndroidXCore = configurations.releaseRuntimeClasspath
                .resolvedConfiguration
                .resolvedArtifacts
                .any { artifact ->
                    artifact.moduleVersion.id.group == "androidx.core" && artifact.name == "core"
                }

        if (!hasAndroidXCore) {
            throw new GradleException(
                    "The QR scanner requires androidx.core:core at runtime, but the release classpath does not contain it.")
        }
    }
}
