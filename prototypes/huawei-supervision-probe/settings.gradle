pluginManagement {
    repositories {
        // Mainland-China mirror for Google's Maven repository. The canonical
        // Google host is intentionally omitted because it stalls on this probe
        // machine instead of failing fast.
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        mavenCentral()
    }
}

rootProject.name = "HuaweiSupervisionProbe"
include(":app")
